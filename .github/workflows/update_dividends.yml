  name: Update dividends every hour (KST 8am-8pm)

  on:
    schedule:
        # 평일 3시간마다 (KST 08·11·14·17·20시). cron 은 UTC 기준.
        - cron: '0 23,2,5,8,11 * * 1-5'
    workflow_dispatch:

  permissions:
    contents: write  # ✅ PUSH 권한 부여

  jobs:
    update:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout
          uses: actions/checkout@v3

        - name: Set up Python
          uses: actions/setup-python@v4
          with:
            python-version: '3.10'

        - name: Install dependencies
          run: |
            pip install yfinance

        - name: Fetch dividend data
          # Secrets 주입! (이게 없으면 KIS API 부분은 그냥 건너뜁니다)
          env:
            KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
            KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          run: python scripts/fetch_dividends.py

        - name: Push data to data branch
          run: |
            # 데이터는 main 이 아니라 data 브랜치에 둔다.
            # 커밋 하나만 두고 매번 덮어써서 이력이 쌓이지 않게 한다.
            git config --global user.email "action@github.com"
            git config --global user.name "GitHub Action"

            # 기존 data 브랜치 내용을 먼저 꺼낸다.
            # 다른 워크플로가 올린 파일을 지우지 않기 위해서다.
            mkdir -p /tmp/out
            if git fetch --depth 1 origin data 2>/dev/null; then
              git archive FETCH_HEAD | tar -x -C /tmp/out || true
            fi

            # 이번에 새로 만든 것으로 덮어쓴다
            cp data/dividends.json /tmp/out/

            # 커밋 하나짜리 브랜치로 통째 교체
            cd /tmp/out
            rm -rf .git
            git init -q
            git add -A
            git commit -q -m "data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:data
